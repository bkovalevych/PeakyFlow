name: Deploy to Firebase Hosting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Install dependencies
        run: dotnet restore
        working-directory: ./src/PeakyFlow.Aspire/PeakyFlow.Aspire.Mobile

      - name: Build and Publish
        run: |
          # Show current directory structure
          echo "Current directory:"
          pwd
          ls -la
          
          # Publish the app
          dotnet publish -c Release -o ./publish-output
          
          # Show published files
          echo "Published files in publish-output:"
          find ./publish-output -type f
          
          # Create deployment directory
          mkdir -p /tmp/firebase-deploy
          
          # Copy published files
          cp -r ./publish-output/wwwroot/. /tmp/firebase-deploy/
          
          # Copy firebase.json from repository root
          cp $GITHUB_WORKSPACE/firebase.json /tmp/firebase-deploy/
          
          # Verify deployment files
          echo "\nDeployment files:"
          find /tmp/firebase-deploy -type f
        working-directory: ./src/PeakyFlow.Aspire/PeakyFlow.Aspire.Mobile

      - name: Install Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash
          firebase --version

      - name: Deploy to Firebase
        run: |
          # Move to deployment directory
          cd /tmp/firebase-deploy
          
          # Verify files are in place
          echo "Files in deployment directory:"
          ls -la
          
          # Deploy to Firebase
          firebase use ${{ secrets.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
