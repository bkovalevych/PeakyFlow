name: Deploy to Firebase Hosting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Install dependencies
        run: dotnet restore
        working-directory: ./src/PeakyFlow.Aspire/PeakyFlow.Aspire.Mobile

      - name: Build and Publish
        run: |
          dotnet publish -c Release -o ./publish-output
          mkdir -p published
          cp -r publish-output/wwwroot/. published/wwwroot/
          cp firebase.json published/
        working-directory: ./src/PeakyFlow.Aspire/PeakyFlow.Aspire.Mobile

      - name: Verify published files
        run: |
          echo "Published files in publish-output:"
          ls -la publish-output/
          echo "\nCopied files in published:"
          ls -la published/
        working-directory: ./src/PeakyFlow.Aspire/PeakyFlow.Aspire.Mobile

      - name: Install Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash
          firebase --version

      - name: Deploy to Firebase
        run: |
          firebase use ${{ secrets.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: ./src/PeakyFlow.Aspire/PeakyFlow.Aspire.Mobile/published
